<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="Mahjong Hand & Score Calculator PWA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mahjong Calc">
  <link rel="manifest" href="<%= BASE_URL %>manifest.json">
  <link rel="icon" type="image/png" href="<%= BASE_URL %>img/icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="<%= BASE_URL %>img/icons/apple-touch-icon.png">
  <title>
    <%= htmlWebpackPlugin.options.title %>
  </title>
</head>

<body>
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
  </noscript>
  <div id="app"></div>
  <script src="main.js"> </script>
</body>

</html>
